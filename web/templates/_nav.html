<!-- Shared sidebar nav — included by all templates -->
<nav class="sidebar">
    <div class="sidebar-logo">
        <h1>CBZ<br>Translator</h1>
        <small>Fully Local · Offline</small>
    </div>
    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
        <span class="nav-icon">📤</span> Upload
    </a>

    <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="/settings">
        <span class="nav-icon">⚙️</span> Settings
    </a>
</nav>
<script>
  // Injected by Flask — provides tunnel URL and auth token to main.js
  window.__CBZ_CONFIG__ = {
    tunnelUrl: {{ (tunnel_url or "")|tojson }},
    authToken: {{ (tunnel_auth_token or "")|tojson }}
  };
</script>
